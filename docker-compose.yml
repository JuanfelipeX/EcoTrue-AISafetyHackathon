# Despliegue público: ECO + túnel de Cloudflare (sin puertos abiertos en la máquina).
# Variables en .env.servidor (ver despliegue/servidor.env.ejemplo); el token del túnel nunca va al repositorio.
services:
  eco:
    build: .
    restart: unless-stopped
    env_file: .env.servidor
    mem_limit: 2500m
  cloudflared:
    image: cloudflare/cloudflared:2025.10.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file: .env.servidor
    depends_on: [eco]
