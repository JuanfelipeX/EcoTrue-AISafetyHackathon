<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="estilos.css">
  <style>body { width: 400px; margin: 0; padding: 12px; } #pestanas label { display: flex; gap: 6px; align-items: flex-start; font-size: 12px; margin: 6px 0; } #pestanas small { color: #777; display: block; }</style>
</head>
<body class="eco-raiz">
  <div class="eco-cabecera">
    <h1>ECO</h1>
    <small>¿Cuántas fuentes hay de verdad?</small>
  </div>
  <div id="contenido">
    <p>Analiza la página actual: ECO la compara con las fuentes que cita y con las pestañas que elijas.</p>
    <details id="pestanas-caja" class="eco-ajustes" open hidden>
      <summary>Comparar con pestañas abiertas (otras notas del mismo tema)</summary>
      <div id="pestanas"></div>
    </details>
    <button id="analizar" class="eco-boton">Analizar esta página</button>
  </div>
  <details class="eco-ajustes">
    <summary>Servidor de ECO</summary>
    <input id="servidor" type="url" placeholder="https://eco.kibosecondbrain.com">
    <button id="guardar-servidor" class="eco-boton">Guardar</button> <span id="estado-servidor"></span>
  </details>
  <script src="config.js"></script>
  <script src="render.js"></script>
  <script src="popup.js"></script>
</body>
</html>
